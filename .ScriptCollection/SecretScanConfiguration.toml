#known false positives of the oci-image-secret-scan. the regexes here are matched against the finding-description produced
#by TFCPS_OCIImageSecretScan (which contains the image-reference, the file-path inside the image and the kind of the
#finding). every entry below targets exactly one file-path and secret-kind combination, so a new, unrelated secret-finding
#in the same package would still fail the scan.

#go-toolchain test-fixtures: shipped by the official go-distribution to drive the tests of the go-tool itself. not a
#credential of this product.
[[ignoredfindings]]
regexes=[
    "usr/local/go/src/cmd/go/testdata/script/goauth_git\\.txt.*contains credentials in the url",
    "usr/local/go/src/crypto/tls/testdata/example-key\\.pem.*contains a private key",
    "usr/local/go/src/crypto/x509/platform_root_key\\.pem.*contains a private key",
]

#fast-uri (used by @angular/cli and @cyclonedx/cyclonedx-npm) ships uri-parsing/serialising test-fixtures containing
#example-urls with inline userinfo. these are documentation-style sample-urls (user:pass@example.com), not real
#credentials.
[[ignoredfindings]]
regexes=[
    "usr/local/lib/node_modules/@angular/cli/node_modules/fast-uri/test/fixtures/uri-js-parse\\.json.*contains credentials in the url",
    "usr/local/lib/node_modules/@angular/cli/node_modules/fast-uri/test/fixtures/uri-js-serialize\\.json.*contains credentials in the url",
    "usr/local/lib/node_modules/@cyclonedx/cyclonedx-npm/node_modules/fast-uri/test/fixtures/uri-js-parse\\.json.*contains credentials in the url",
    "usr/local/lib/node_modules/@cyclonedx/cyclonedx-npm/node_modules/fast-uri/test/fixtures/uri-js-serialize\\.json.*contains credentials in the url",
]

#flutter ships a dummy tls-key under its asset-loading-tests. not a credential of this product.
[[ignoredfindings]]
regexes=[
    "Workspace/Tools/flutter/packages/flutter_tools/test/data/asset_test/tls_cert/dummy-key\\.pem.*contains a private key",
]
