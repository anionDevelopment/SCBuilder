      <text x="510.81" y="167.664" fill="#000" font-size="13" textLength="877.246" font-family="'DejaVu Sans'">SCGitHubRunner is a slim, self-hosted GitHub-Actions-runner image that starts job-containers and keeps their externals host-identical.</text>
