      <text x="3337.7" y="167.664" fill="#000" font-size="13" textLength="1277.472" font-family="'DejaVu Sans'">SCTaskRunnerIOS provides an HTTP-server that builds iOS-app build-steps (e.g. flutter ios-builds) natively on a macOS-host on behalf of remote clients (see ScriptCollection's TFCPS_RemoteBuild).</text>
    </g>
