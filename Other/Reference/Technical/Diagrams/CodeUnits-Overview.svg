      <path d="M4666,150.2969 L4666,175.4297 A0,0 0 0 0 4666,175.4297 L6933.9561,175.4297 A0,0 0 0 0 6933.9561,175.4297 L6933.9561,160.2969 L6923.9561,150.2969 L5804,150.2969 L5800,90.4569 L5796,150.2969 L4666,150.2969 A0,0 0 0 0 4666,150.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;" />
      <path d="M6923.9561,150.2969 L6923.9561,160.2969 L6933.9561,160.2969 L6923.9561,150.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;" />
      <text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="2246.9561" x="4672" y="167.3638">SCTaskRunnerMacOS provides an HTTP-server that builds operating-system-bound build-steps (e.g. flutter macos-desktop-builds) natively on a macOS-host on behalf of remote clients requiring RunnerOperatingSystem.MacOS (see ScriptCollection's TFCPS_RemoteBuild). iOS-builds delegate to the dedicated SCTaskRunnerIOS-codeunit instead.</text>
    </g>
