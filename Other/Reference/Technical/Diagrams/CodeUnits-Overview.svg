      <path d="M4664.95,150.597 L4664.95,175.73 A0,0 0 0 0 4664.95,175.73 L6932.906,175.73 A0,0 0 0 0 6932.906,175.73 L6932.906,160.597 L6922.906,150.597 L5802.93,150.597 L5798.93,90.657 L5794.93,150.597 L4664.95,150.597 A0,0 0 0 0 4664.95,150.597" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" />
