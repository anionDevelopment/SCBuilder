      <path d="M504.81,150.597 L504.81,175.73 A0,0 0 0 0 504.81,175.73 L1403.056,175.73 A0,0 0 0 0 1403.056,175.73 L1403.056,160.597 L1393.056,150.597 L957.93,150.597 L953.93,90.657 L949.93,150.597 L504.81,150.597 A0,0 0 0 0 504.81,150.597" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" />
