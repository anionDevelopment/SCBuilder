    <g class="entity" data-qualified-name="SCTaskRunnerAndroidNote" id="ent0008" data-source-line="18">
      <path d="M1437.62,150.597 L1437.62,175.73 A0,0 0 0 0 1437.62,175.73 L3296.247,175.73 A0,0 0 0 0 3296.247,175.73 L3296.247,160.597 L3286.247,150.597 L2370.93,150.597 L2366.93,90.657 L2362.93,150.597 L1437.62,150.597 A0,0 0 0 0 1437.62,150.597" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" />
      <path d="M3286.247,150.597 L3286.247,160.597 L3296.247,160.597 L3286.247,150.597" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" />
      <text x="1443.62" y="167.664" fill="#000" font-size="13" textLength="1837.627" font-family="'DejaVu Sans'">SCTaskRunnerAndroid is a container-image that provides an HTTP-server which builds Android-app build-steps (e.g. flutter appbundle-builds) on behalf of remote clients (see ScriptCollection's TFCPS_RemoteBuild), using the Android-SDK/NDK/Flutter-toolchain bundled in this image.</text>
    </g>
