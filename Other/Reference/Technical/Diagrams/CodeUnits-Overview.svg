      <path d="M1438.5,150.2969 L1438.5,175.4297 A0,0 0 0 0 1438.5,175.4297 L3297.1274,175.4297 A0,0 0 0 0 3297.1274,175.4297 L3297.1274,160.2969 L3287.1274,150.2969 L2372,150.2969 L2368,90.4569 L2364,150.2969 L1438.5,150.2969 A0,0 0 0 0 1438.5,150.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;" />
      <path d="M3287.1274,150.2969 L3287.1274,160.2969 L3297.1274,160.2969 L3287.1274,150.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;" />
      <text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="1837.6274" x="1444.5" y="167.3638">SCTaskRunnerAndroid is a container-image that provides an HTTP-server which builds Android-app build-steps (e.g. flutter appbundle-builds) on behalf of remote clients (see ScriptCollection's TFCPS_RemoteBuild), using the Android-SDK/NDK/Flutter-toolchain bundled in this image.</text>
    </g>
